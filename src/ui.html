<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The author's own icon, committed as SVG and linked directly. The PNGs the
     manifest and iOS use are rasterized from this same file at build time. -->
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="description" content="London Rura — a London Underground departures board for every station on the TfL network.">
<title>London Rura</title>
<style>
/* A departures board, in a departures board's colours.
   The original was Arial on white with grey table borders, which was legible
   but had nothing of a board about it. This is the same information laid out
   the way a platform board lays it out: a near-black face, one warm accent for
   the times, and the line colours doing the one job they are actually there
   for.

   The accent is #FFD300 — Circle's yellow, and the colour a real board lights
   its times in. It is not decoration: the minutes are the thing a reader came
   for, so they get the only bright colour on the page. Everything else is
   greyscale, which leaves the line chips as the only other colour present and
   keeps them competing with nothing.

   Both schemes are chosen against measured contrast, not by eye — see the
   `line_ink` function in src/departures.rs, which is what decides black or
   white text on each chip so that all twelve lines clear 4.5:1. */
:root {
  color-scheme: dark light;
  --paper: #0b0b0c;
  --panel: #16161a;
  --ink: #eceff4;
  --muted: #9aa3b2;
  --rule: #2a2d33;
  --accent: #ffd300;   /* the minutes */
  --due: #ff453a;      /* arriving now */
  --focus: #4da3ff;
  /* The chip ring. Two line colours are almost invisible against a page of
     their own shade -- Northern's black on this page is 1.07:1 and Circle's
     yellow on the light page is 1.34:1 -- so every chip gets a hairline of
     the page's ink to give it a defined edge. It is decoration, not data: the
     line's name is on the chip and does not depend on seeing the fill. */
  --ring: rgba(236, 239, 244, 0.45);
}
@media (prefers-color-scheme: light) {
  :root {
    --paper: #f6f7f9;
    --panel: #ffffff;
    --ink: #14161a;
    --muted: #5b6472;
    --rule: #d3d7de;
    --accent: #8a6d00;  /* the same accent, darkened to stay legible on white */
    --due: #c2211a;
    --focus: #0b5bd3;
    --ring: rgba(20, 22, 26, 0.35);
  }
}
* { box-sizing: border-box; }
body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  padding: 16px 16px 40px;
  background: var(--paper);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.4;
}
main { max-width: 44rem; margin: 0 auto; }
h1 {
  font-size: 1.7rem;
  margin: 0 0 2px;
  letter-spacing: -0.01em;
}
label {
  display: block;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 20px 0 6px;
}
select {
  font: inherit;
  /* The one control on the page, so it gets a full-width touch target. */
  padding: 12px;
  min-height: 48px;
  width: 100%;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 8px;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
#notice, .stamp { color: var(--muted); margin: 8px 0 0; }
.stamp { font-size: 0.85rem; }
#departures { margin-top: 22px; }
#departures p { color: var(--muted); }
h2 { font-size: 1.15rem; margin: 26px 0 10px; }
h3 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin: 20px 0 0;
}
table { width: 100%; border-collapse: collapse; margin-top: 8px; }
th, td { padding: 9px 12px; text-align: left; }
/* A board has no grid of boxes; the rows are separated by a hairline, the way
   a split-flap board separates its rows. */
thead th {
  font-size: 0.72rem;
  font-weight: normal;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  border-bottom: 2px solid var(--rule);
}
tbody tr + tr td { border-top: 1px solid var(--rule); }
tbody td:first-child { padding-left: 0; }
tbody td:last-child, thead th:last-child { text-align: right; padding-right: 0; }
/* The minutes: the only bright thing on the page, and the reason for it. */
td:last-child {
  color: var(--accent);
  font-weight: bold;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* Zero means "at the platform", which is not "in no time" — it is the thing
   the reader is waiting for, so it gets its own colour. */
td.due { color: var(--due); }
/* The line chip. Its background and text colour are set inline by Rust from
   the published line colour; this only provides the shape and the edge. The
   attribute is on the chip, not on the cell it sits in. */
span[data-line] {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: bold;
  white-space: nowrap;
  box-shadow: 0 0 0 1px var(--ring);
}
@media (prefers-reduced-motion: no-preference) {
  #departures { animation: settle 160ms ease-out; }
  @keyframes settle { from { opacity: 0.4; } to { opacity: 1; } }
}
</style>
</head>
<body>
<main>
  <h1>London Rura</h1>
  <p id="notice" role="status" aria-live="polite">Loading stations…</p>

  <label for="station">Station</label>
  <!-- Rust builds every option; this shell supplies only the empty first one,
       which is also how the reader returns to "no station". -->
  <select id="station" name="station" aria-describedby="notice">
    <option value="">Select a station</option>
  </select>

  <div id="departures" aria-live="polite" aria-busy="false"></div>
</main>

<noscript>This board needs JavaScript to run. Departures come live from the TfL API and are shown here; without JavaScript there is nothing to show.</noscript>
<!-- The only JavaScript in this app: a dynamic import of the generated
     bindings, and a message if that fails. Everything else is Rust. -->
<script type="module">
import('./app.js').then(m => m.default()).catch(error => { document.getElementById('notice').textContent = 'London Rura could not start.'; const box = document.getElementById('departures'); box.textContent = 'London Rura could not start. Reload the page or check your connection. ' + error; });
</script>
</body>
</html>
