[package]
name = "london_rura"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Private, browser-side London Underground departures board in Rust"

[lib]
name = "london_rura"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Host-only: they rasterize the icon while the crate compiles and never reach
# the wasm. `default-features = false` is deliberate — it drops `text`, so
# usvg needs no font database, which matters because this app's icon is a
# roundel whose wordmark is drawn as paths, not `<text>`. See build.rs.
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
  "Window", "Document", "Element", "Node", "HtmlElement", "HtmlInputElement",
  "Event", "MouseEvent", "KeyboardEvent", "Location", "History", "Url",
  "UrlSearchParams", "Navigator", "Response", "ServiceWorkerContainer",
  "ServiceWorkerRegistration", "ServiceWorker", "RegistrationOptions",
  "Performance", "MediaQueryList", "console"
] }

[lints.rust]
warnings = "deny"

[profile.release]
strip = true
lto = true
opt-level = "s"
