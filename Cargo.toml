[package]
name = "london_rura"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Private, browser-side London Underground departures board in Rust"

[lib]
name = "london_rura"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Host-only: they rasterize the icon while the crate compiles and never reach
# the wasm. `default-features = false` is deliberate — it drops `text`, so
# usvg needs no font database, which matters because this app's icon is a
# roundel whose wordmark is drawn as paths, not `<text>`. See build.rs.
usvg = { version = "0.48", default-features = false }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A caret, not an exact pin: `wasm-bindgen-futures`, `js-sys` and `web-sys`
# each depend on one exact `wasm-bindgen`, so `Cargo.lock` decides the version
# whichever way this line is written, and an exact pin here would only be a
# second copy of it to keep in step. The bindings generator must be that same
# version -- a mismatch fails at load time in the browser, not at compile time
# -- and both workflows read the version from the lock rather than naming it.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "Node", "HtmlElement", "HtmlInputElement",
  "Event", "MouseEvent", "KeyboardEvent", "Location", "History", "Url",
  "UrlSearchParams", "Navigator", "Response", "ServiceWorkerContainer",
  "ServiceWorkerRegistration", "ServiceWorker", "ServiceWorkerState",
  "RegistrationOptions",
  "Performance", "MediaQueryList", "console"
] }

[lints.rust]
warnings = "deny"

[profile.release]
strip = true
lto = true
opt-level = "s"
