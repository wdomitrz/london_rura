name: build

# Two builds, in order, because there are two targets. The order is not a
# convenience: `build.rs` derives the service worker's cache version from the
# bytes of every other file in `dist/`, and the wasm is one of them. Building
# the host side first would pin the cache to whatever the previous build left
# behind, and the job would ship a board whose cache never invalidates. So this
# runs exactly what AGENTS.md documents, in the order it documents it.
#
# What the job is for: the wasm and the bindings are build output and are never
# committed, so nothing in the repository proves they still build, or that the
# two steps still agree. That is the gap this closes -- it runs both steps from
# a clean checkout and inspects the `dist/` they produce. Nothing is published
# here. `dist/` is left as a workflow artifact so it can be downloaded, or
# promoted to GitHub Pages in a follow-up if that is ever wanted.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match the `wasm-bindgen = "=0.2.128"` pin in Cargo.toml. A mismatched
  # generator emits bindings the runtime will not load, and the page then fails
  # to start with a loader-failure message -- a failure that looks like an app
  # bug and is not one.
  WASM_BINDGEN_VERSION: 0.2.128

jobs:
  build:
    name: Build the board
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          # The board's target, and the only one the job needs.
          # `dtolnay/rust-toolchain` takes the channel from `toolchain:`;
          # `targets:` adds to it, so the two lines together are "stable, plus
          # wasm32".
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The wasm and the host build share a `target/` directory but not a
          # target triple, so cache both. A wasm-only cache would miss on every
          # host build and a host-only cache on every wasm build.
          key: ${{ job.job }}

      - name: Install the pinned wasm-bindgen generator
        run: |
          set -euuo pipefail
          # The official prebuilt binary, not `cargo install`. The CLI is pinned
          # to one exact version, and `cargo install` would compile it from
          # source -- minutes, and a second toolchain's worth of failure surface.
          # The release publishes a musl static binary plus a `.sha256sum` per
          # platform, so verify against that file and fail loudly rather than
          # generating bindings from an unverified download.
          #
          # The digest is checked against the release's own checksum file, and
          # then compared to the one recorded in the repository. Both, because
          # they fail differently: the first catches a corrupted or truncated
          # download, the second catches a legitimately re-uploaded release --
          # which is the one an attacker would want, since only they can
          # re-upload it.
          version="$WASM_BINDGEN_VERSION"
          target=x86_64-unknown-linux-musl
          asset="wasm-bindgen-${version}-${target}.tar.gz"
          base="https://github.com/rustwasm/wasm-bindgen/releases/download/${version}"
          pinned=b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f

          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${asset}" "${base}/${asset}"
          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${asset}.sha256sum" "${base}/${asset}.sha256sum"

          # The published checksum file names the asset `gh-release/<name>`,
          # because that is where the release workflow unpacked it, so
          # `sha256sum -c` against the download name alone finds no file to
          # verify. Take the digest out of that file by field and check it
          # ourselves -- first against what we actually downloaded, which catches
          # a corrupted or truncated transfer, and then against the digest
          # recorded in this repository, which catches a re-uploaded release.
          # Only the release owner can re-upload, and that is exactly the case
          # worth refusing rather than trusting.
          published="$(awk '{print $1}' "/tmp/${asset}.sha256sum")"
          test -n "$published" \
            || { echo "::error::the release published an empty checksum for ${asset}"; exit 1; }
          actual="$(sha256sum "/tmp/${asset}" | cut -d' ' -f1)"
          test "$actual" = "$published" \
            || { echo "::error::${asset} does not match its published checksum (${published}, got ${actual})"; exit 1; }
          test "$actual" = "$pinned" \
            || { echo "::error::${asset} matches its published checksum but not the digest recorded in the repository; re-verify it before accepting this download"; exit 1; }
          echo "${asset}: ${actual} verified against the release and the repository"

          mkdir -p "$HOME/.cargo/bin"
          tar --extract --gzip --file "/tmp/${asset}" \
            --directory "$HOME/.cargo/bin" \
            --strip-components 1 \
            "wasm-bindgen-${version}-${target}/wasm-bindgen"
          chmod +x "$HOME/.cargo/bin/wasm-bindgen"
          # Refuse to build at all on a version mismatch, with a message that
          # names the fix rather than leaving a broken `dist/` behind.
          test "$("$HOME/.cargo/bin/wasm-bindgen" --version)" = "wasm-bindgen ${version}" \
            || { echo "::error::the installed generator does not report ${version}"; exit 1; }
          echo "wasm-bindgen $("$HOME/.cargo/bin/wasm-bindgen" --version) ready"

      - name: Build the board (wasm target)
        run: |
          set -eu
          cargo build --locked --lib --target wasm32-unknown-unknown --release

      - name: Generate the web bindings
        run: |
          set -eu
          # Writes dist/app.js and dist/app_bg.wasm -- the board itself. They
          # exist nowhere else in the tree, and nothing committed would notice
          # them going stale.
          wasm-bindgen --target web --no-typescript --out-dir dist --out-name app \
            target/wasm32-unknown-unknown/release/london_rura.wasm

      - name: Build the rest of the site
        run: |
          set -eu
          # `build.rs` adds the six files it owns -- the shell, the service
          # worker with its version substituted, the two rasterized icons and
          # the manifest -- and derives the worker's content cache version. It
          # must run after the bindings step: the version is hashed from what
          # the previous step wrote.
          #
          # The touch is not redundant. `build.rs` writes into the source tree,
          # not into OUT_DIR, so Cargo cannot tell that anything changed and
          # will not re-run it for a second, otherwise identical invocation. The
          # first build after step 1 only recompiles the crate; the second would
          # be a no-op and copy nothing -- leaving `dist/` with the two wasm
          # artefacts and none of the six shell files, which is the exact
          # half-built site this shape has already had. A fresh CI runner has
          # nothing to compile at all and reproduces it every time, so the step
          # would be red on its first commit.
          touch build.rs
          cargo build --release --locked

      - name: Check the built site
        run: |
          set -eu
          # No test can assert on `dist/`: it is gitignored, so the release
          # gate's exported tree never has it (see tests/shell.rs). The build is
          # therefore the only thing that ever checks it -- so this checks it,
          # rather than trusting a green job to mean the site is whole.
          #
          # A green build that produced four of the eight files is exactly the
          # failure this shape has already had. Verify the count, not the exit
          # status.
          expected="app_bg.wasm app.js icon-192.png icon-512.png icon.svg index.html manifest.webmanifest service-worker.js"
          missing=""
          for file in $expected; do
            if [ -s "dist/${file}" ]; then
              echo "  ok   dist/${file} ($(stat -c%s "dist/${file}") bytes)"
            else
              missing="${missing} ${file}"
            fi
          done
          # One pattern per line: `grep -x -F -v -f` reads fixed strings from a
          # file, one per line. Matching the whole space-separated list in one
          # pattern matches nothing, so every file reads as unexpected and the
          # check fails on a perfectly good build.
          printf '%s\n' $expected >/tmp/expected-files
          extra="$(cd dist && ls | grep -x -F -v -f /tmp/expected-files || true)"
          if [ -n "$missing" ] || [ -n "$extra" ]; then
            echo "::error::the site is incomplete -- missing:${missing:- none}; unexpected:${extra:- none}"
            exit 1
          fi
          # A file of a few bytes is a truncated write, not a successful build.
          test -s dist/app_bg.wasm || { echo "::error::the board wasm is empty"; exit 1; }
          # The cache version is derived at build time, so an unsubstituted
          # placeholder would ship a service worker that never invalidates.
          if grep -q '__VERSION__' dist/service-worker.js; then
            echo "::error::dist/service-worker.js still carries the __VERSION__ placeholder"
            exit 1
          fi
          # This app is the one that is NOT fully offline, and the invariant
          # that makes that true is that the worker's allowlist is exactly the
          # eight shell files and nothing else. A stray entry for the TfL API --
          # or a catch-all fetch handler -- would serve arrivals from a cache
          # that is up to hours old while the board claimed to be live, which is
          # worse than showing nothing. Assert the shape rather than trust it.
          # Strip the comments first. This worker explains in prose why it
          # does NOT touch the API, so a naive grep for the hostname would fail
          # a perfectly correct build -- which is how a real check turns into a
          # check everyone learns to ignore. What must be absent is the
          # hostname in *code*.
          sed 's://.*::' dist/service-worker.js | sed '/^[[:space:]]*\/\*/,/^[[:space:]]*\*\//d' > /tmp/sw-code.js
          if grep -q 'api.tfl.gov.uk' /tmp/sw-code.js; then
            echo "::error::the service worker names api.tfl.gov.uk in code; it must not cache or intercept the live API"
            exit 1
          fi
          # The handler must still be an allowlist, not a blanket respondWith.
          if ! grep -q 'ASSETS.includes(event.request.url)' /tmp/sw-code.js; then
            echo "::error::the service worker no longer allowlists its assets; it must not answer unrelated requests from the cache"
            exit 1
          fi
          # The bindings must actually be bindings: the page loads this file
          # with a dynamic import, so a truncated one fails only in a browser,
          # long after the build looked fine.
          grep -q 'export' dist/app.js \
            || { echo "::error::dist/app.js carries no exports; the page's dynamic import would fail"; exit 1; }
          # The glue must actually RUN the app. This is the check that would
          # have caught the app shipping four times with a green build and a
          # page that did nothing: a plain `#[wasm_bindgen]` entry point is an
          # ordinary export, the glue does not re-export it, so the loader's
          # `m.default()` initialises the module and nothing ever calls the
          # board. The symptom is a page that sits on its loading message
          # forever with no error anywhere, and every test that could run had
          # passed. `#[wasm_bindgen(start)]` makes the glue emit a call to the
          # start section; if that call is absent, the app cannot start.
          grep -q '__wbindgen_start' dist/app.js \
            || { echo "::error::dist/app.js never calls the wasm start section; the board would load and then do nothing. Is the entry point marked #[wasm_bindgen(start)]?"; exit 1; }
          # The manifest is assembled by build.rs, so a shape that drifted from
          # the spec is caught here rather than by a launcher refusing it.
          # A heredoc, not `python3 -c '...'`. Two reasons, both of which have
          # cost this family a red run: `-c` hands the string to the interpreter
          # as-is, so the indentation of a multi-line body is an
          # IndentationError before a single line runs; and an apostrophe
          # anywhere in the body ends the shell quote, so bash never reaches
          # Python at all. The body sits at the same indentation as the
          # `python3` line, which the YAML block scalar dedents to column 0.
          python3 - <<'PY'
          import json
          m = json.load(open("dist/manifest.webmanifest"))
          for key in ("id", "start_url", "scope"):
              assert m[key] == "./", f"{key} must be relative, got {m[key]!r}"
          assert m["name"] == "London Rura", "the name must be preserved"
          assert m["short_name"] == "London Rura", "the short name must be preserved"
          assert m["theme_color"] == "#000000", "the theme colour must be the original one"
          assert m["background_color"] == "#ffffff", "the background colour must be the original one"
          assert m["display"] == "standalone", "the original display mode must be preserved"
          sizes = sorted(i["sizes"] for i in m["icons"])
          assert sizes == ["192x192", "512x512"], f"unexpected icon sizes {sizes}"
          print("  ok   the manifest kept its name, colours and display mode")
          PY

          # The published SVG must be the committed icon, byte for byte. The
          # page links it and the worker precaches it, and the two PNGs are
          # rasterized from it, so a drift here is a wrong favicon, an install
          # icon from somewhere else, and a cache entry that is not the source
          # of the rest. This is the one repo in the family that had to create
          # its icon rather than preserve one, so its bytes are pinned here.
          python3 - <<'PY'
          import hashlib
          with open("assets/icon.svg", "rb") as handle:
              source = handle.read()
          with open("dist/icon.svg", "rb") as handle:
              published = handle.read()
          assert published == source, "dist/icon.svg is not the committed icon"
          assert hashlib.sha256(source).hexdigest() == (
              "556cda36a81f7a1176782a740596e169fec8bd7f6ab8a17985a1d6cc0dfa36bb"
          ), "assets/icon.svg is no longer the credited roundel from Wikimedia"
          print("  ok   dist/icon.svg is the committed, credited roundel")
          PY

      - name: Run the tests
        run: cargo test --locked

      - name: Lint
        run: |
          set -eu
          # Both targets, as AGENTS.md requires. The crate denies warnings, but
          # only for the target being compiled, so a clean host build says
          # nothing about the wasm one.
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          # No CDN: the site is small, and a copy that cannot be evicted is a
          # copy that will still be downloadable after a bad build.
          retention-days: 7
