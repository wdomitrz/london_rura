#
# Publish the site to GitHub Pages, from a build of its own.
#
# Why this is a separate workflow rather than extra steps in `build.yml`:
# Pages deploys need `pages: write` and `id-token: write` and an environment,
# and `build.yml` runs on every pull request from a fork, where neither the
# permission nor the environment exists. Splitting them keeps the build honest
# -- it stays runnable by anyone who can push a branch, with read-only
# permissions, and the thing that can overwrite the live site exists only on
# the default branch.
#
# What it does NOT do is deploy on every push anywhere: `on:` is `branches:
# [master]`, and the `deploy` job repeats that test for itself. A feature
# branch therefore runs the whole build -- wasm, bindings, the eight-file site
# check, tests, clippy on both targets -- and still cannot publish, so the
# thing that overwrites the live site is reachable from exactly one ref.
#
# `build.yml` already runs the same two build steps in the order AGENTS.md
# requires and inspects the result. This workflow reuses nothing from it and
# builds again rather than passing the artifact across: `upload-artifact` does
# not preserve the executable bit or the empty directories, and the Pages
# artifact is a single tarball the deploy finds by name anyway. Two builds of
# a 1-crate site is cheaper than debugging a site that is missing its app.
#
# Pages itself is not enabled on this repository, so the deploy job fails at
# `actions/deploy-pages` with `Ensure GitHub Pages has been enabled`. That is a
# one-time repository setting (Settings -> Pages -> Source -> GitHub Actions)
# and not a defect in this file; the build job above it is the part that
# verifies anything, and it is the part that must be green.

name: pages

# `concurrency` is not a preference here. Pages holds a single deployment slot
# per site, and two deploys racing each other can interleave so that the older
# one is published last -- a live site that is a version behind master, with
# both jobs green. Cancelling the in-flight run instead would let a deploy for
# an older commit win the slot.
concurrency:
  group: pages
  cancel-in-progress: false

on:
  # Every commit that lands on master is deployed, and nothing else. A push to
  # any other branch builds but does not publish, so a feature branch is
  # reviewable without moving the live site.
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Must equal the `wasm-bindgen = "=0.2.128"` pin in Cargo.toml. A mismatched
  # generator emits bindings the runtime will not load, and the page then fails
  # to start with a loader-failure message -- a failure that looks like an app
  # bug and is not one. `tests/shell.rs` asserts the two are equal rather than
  # trusting them to be edited together.
  #
  # Declared in the workflow's own `env:` and read back as a shell variable,
  # not inlined: an undeclared variable expands to nothing, the generator step
  # installs nothing, and every other check still passes.
  WASM_BINDGEN_VERSION: 0.2.128
  # Deliberately no RUSTFLAGS here. Sibling apps in this family need
  # `--cfg=web_sys_unstable_apis` for the Screen Wake Lock API, which is behind
  # that cfg in web-sys 0.3.105 rather than merely feature-gated -- and a
  # `build.rs` cfg does not reach a registry dependency. This board does not
  # use a wake lock: verified on a clean build, `cargo build --locked --lib
  # --target wasm32-unknown-unknown --release` succeeds with RUSTFLAGS unset
  # and no `.cargo/config.toml`. The flag is not a harmless default to carry
  # here, and `tests/shell.rs` holds the workflow to the measured answer.

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          # The board's target, and the only one the job needs. `toolchain:`
          # names the channel and `targets:` adds to it, so the two lines
          # together are "stable, plus wasm32".
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache the Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The wasm and the host build share a `target/` directory but not a
          # target triple, so cache both. A wasm-only cache would miss on every
          # host build and a host-only cache on every wasm build.
          key: ${{ job.job }}

      - name: Install the pinned wasm-bindgen generator
        run: |
          set -euuo pipefail
          # The official prebuilt binary, not `cargo install`. The CLI is pinned
          # to one exact version, and `cargo install` would compile it from
          # source -- minutes, and a second toolchain's worth of failure surface.
          # The release publishes a musl static binary plus a `.sha256sum` per
          # platform, so verify against that file and fail loudly rather than
          # generating bindings from an unverified download.
          #
          # The digest is checked against the release's own checksum file, and
          # then compared to the one recorded in the repository. Both, because
          # they fail differently: the first catches a corrupted or truncated
          # download, the second catches a legitimately re-uploaded release --
          # which is the one an attacker would want, since only they can
          # re-upload it.
          version="$WASM_BINDGEN_VERSION"
          target=x86_64-unknown-linux-musl
          asset="wasm-bindgen-${version}-${target}.tar.gz"
          base="https://github.com/rustwasm/wasm-bindgen/releases/download/${version}"
          pinned=b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f

          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${asset}" "${base}/${asset}"
          curl --fail --location --silent --show-error --retry 3 \
            --output "/tmp/${asset}.sha256sum" "${base}/${asset}.sha256sum"

          # The published checksum file names the asset `gh-release/<name>`,
          # because that is where the release workflow unpacked it, so
          # `sha256sum -c` against the download name alone finds no file to
          # verify. Take the digest out of that file by field and check it
          # ourselves -- first against what we actually downloaded, which
          # catches a corrupted or truncated transfer, and then against the
          # digest recorded in this repository, which catches a re-uploaded
          # release. Only the release owner can re-upload, and that is exactly
          # the case worth refusing rather than trusting.
          published="$(awk '{print $1}' "/tmp/${asset}.sha256sum")"
          test -n "$published" \
            || { echo "::error::the release published an empty checksum for ${asset}"; exit 1; }
          actual="$(sha256sum "/tmp/${asset}" | cut -d' ' -f1)"
          test "$actual" = "$published" \
            || { echo "::error::${asset} does not match its published checksum (${published}, got ${actual})"; exit 1; }
          test "$actual" = "$pinned" \
            || { echo "::error::${asset} matches its published checksum but not the digest recorded in the repository; re-verify it before accepting this download"; exit 1; }
          echo "${asset}: ${actual} verified against the release and the repository"

          mkdir -p "$HOME/.cargo/bin"
          tar --extract --gzip --file "/tmp/${asset}" \
            --directory "$HOME/.cargo/bin" \
            --strip-components 1 \
            "wasm-bindgen-${version}-${target}/wasm-bindgen"
          chmod +x "$HOME/.cargo/bin/wasm-bindgen"
          # Refuse to build at all on a version mismatch, with a message that
          # names the fix rather than leaving a broken `dist/` behind.
          test "$("$HOME/.cargo/bin/wasm-bindgen" --version)" = "wasm-bindgen ${version}" \
            || { echo "::error::the installed generator does not report ${version}"; exit 1; }
          echo "wasm-bindgen $("$HOME/.cargo/bin/wasm-bindgen" --version) ready"

      - name: Build the board (wasm target)
        run: |
          set -eu
          cargo build --locked --lib --target wasm32-unknown-unknown --release

      - name: Generate the web bindings
        run: |
          set -eu
          # Writes dist/app.js and dist/app_bg.wasm -- the board itself. They
          # exist nowhere else in the tree, and nothing committed would notice
          # them going stale.
          wasm-bindgen --target web --no-typescript --out-dir dist --out-name app \
            target/wasm32-unknown-unknown/release/london_rura.wasm

      - name: Build the rest of the site
        run: |
          set -eu
          # `build.rs` adds the six files it owns -- the shell, the service
          # worker with its version substituted, the two rasterized icons and
          # the manifest -- and derives the worker's content cache version. It
          # must run after the bindings step: the version is hashed from what
          # the previous step wrote.
          #
          # The touch is not redundant. `build.rs` writes into the source tree,
          # not into OUT_DIR, so Cargo cannot tell that anything changed and
          # will not re-run it for a second, otherwise identical invocation.
          # The first build after the bindings step only recompiles the crate;
          # the second would be a no-op and copy nothing -- leaving `dist/`
          # with the two wasm artefacts and none of the six shell files, which
          # is the exact half-built site this project would otherwise publish.
          # A fresh CI runner has nothing compiled at all and reproduces it
          # every time, so the step would be red on its first commit.
          touch build.rs
          cargo build --release --locked

      - name: Check the built site
        run: |
          set -eu
          # No test can assert on `dist/`: it is gitignored, so the release
          # gate's exported tree never has it (see tests/shell.rs). The build
          # is therefore the only thing that ever checks it -- so this checks
          # it, rather than trusting a green job to mean the site is whole.
          #
          # A green build that produced four of the eight files is exactly the
          # failure this shape has already had. Verify the count, not the exit
          # status.
          expected="app_bg.wasm app.js icon-192.png icon-512.png icon.svg index.html manifest.webmanifest service-worker.js"
          missing=""
          for file in $expected; do
            if [ -s "dist/${file}" ]; then
              echo "  ok   dist/${file} ($(stat -c%s "dist/${file}") bytes)"
            else
              missing="${missing} ${file}"
            fi
          done
          # One pattern per line: `grep -x -F -v -f` reads fixed strings from a
          # file, one per line. Matching the whole space-separated list in one
          # pattern matches nothing, so every file reads as unexpected and the
          # check fails on a perfectly good build.
          printf '%s\n' $expected >/tmp/expected-files
          extra="$(cd dist && ls | grep -x -F -v -f /tmp/expected-files || true)"
          if [ -n "$missing" ] || [ -n "$extra" ]; then
            echo "::error::the site is incomplete -- missing:${missing:- none}; unexpected:${extra:- none}"
            exit 1
          fi
          # A file of a few bytes is a truncated write, not a successful build.
          test -s dist/app_bg.wasm || { echo "::error::the board wasm is empty"; exit 1; }
          # The cache version is derived at build time, so an unsubstituted
          # placeholder would ship a service worker that never invalidates.
          if grep -q '__VERSION__' dist/service-worker.js; then
            echo "::error::dist/service-worker.js still carries the __VERSION__ placeholder"
            exit 1
          fi
          # This app is the one that is NOT fully offline, and the invariant
          # that makes that true is that the worker's allowlist is exactly the
          # eight shell files and nothing else. A stray entry for the TfL API --
          # or a catch-all fetch handler -- would serve arrivals from a cache
          # that is up to hours old while the board claimed to be live, which is
          # worse than showing nothing. Assert the shape rather than trust it.
          # Strip the comments first. This worker explains in prose why it does
          # NOT touch the API, so a naive grep for the hostname would fail a
          # perfectly correct build -- which is how a real check turns into a
          # check everyone learns to ignore. What must be absent is the
          # hostname in *code*.
          sed 's://.*::' dist/service-worker.js | sed '/^[[:space:]]*\/\*/,/^[[:space:]]*\*\//d' > /tmp/sw-code.js
          if grep -q 'api.tfl.gov.uk' /tmp/sw-code.js; then
            echo "::error::the service worker names api.tfl.gov.uk in code; it must not cache or intercept the live API"
            exit 1
          fi
          # The handler must still be an allowlist, not a blanket respondWith.
          if ! grep -q 'ASSETS.includes(url)' /tmp/sw-code.js; then
            echo "::error::the service worker no longer allowlists its assets; it must not answer unrelated requests from the cache"
            exit 1
          fi
          # The bindings must actually be bindings: the page loads this file
          # with a dynamic import, so a truncated one fails only in a browser,
          # long after the build looked fine.
          grep -q 'export' dist/app.js \
            || { echo "::error::dist/app.js carries no exports; the page's dynamic import would fail"; exit 1; }
          # The glue must actually RUN the app. This is the check that would
          # have caught the app shipping four times with a green build and a
          # page that did nothing: a plain `#[wasm_bindgen]` entry point is an
          # ordinary export, the glue does not re-export it, so the loader's
          # `m.default()` initialises the module and nothing ever calls the
          # board. The symptom is a page that sits on its loading message
          # forever with no error anywhere, and every test that could run had
          # passed. `#[wasm_bindgen(start)]` makes the glue emit a call to the
          # start section; if that call is absent, the app cannot start.
          grep -q '__wbindgen_start' dist/app.js \
            || { echo "::error::dist/app.js never calls the wasm start section; the board would load and then do nothing. Is the entry point marked #[wasm_bindgen(start)]?"; exit 1; }
          # The install icons must be real PNGs at the sizes the manifest
          # declares, rasterized from the committed roundel rather than
          # committed by hand.
          for size in 192 512; do
            test "$(head -c 8 "dist/icon-${size}.png" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" \
              || { echo "::error::dist/icon-${size}.png is not a PNG"; exit 1; }
          done
          # The page must call the initializer. This is a one-line check for a
          # failure that is otherwise completely silent -- see tests/shell.rs.
          grep -q 'm.default()' dist/index.html \
            || { echo "::error::dist/index.html does not initialise the bindings; the board would never start"; exit 1; }

      - name: Run the tests
        run: cargo test --locked

      - name: Lint
        run: |
          set -eu
          # Both targets, as AGENTS.md requires. The crate denies warnings, but
          # only for the target being compiled, so a clean host build says
          # nothing about the wasm one -- and `src/ui.rs` is wasm-only, which
          # is where every warning this step exists to catch can be.
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # `upload-pages-artifact` is not `upload-artifact`. The Pages
          # artifact is a single tarball the deploy action then finds *by
          # name*, and a plain upload into the run's artifacts produces a
          # green build followed by a deploy that cannot find what it was
          # given. `github-pages` is this action's default name and is stated
          # here so the deploy step's `artifact_name` has something to match.
          name: github-pages
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    # Only a build for master publishes. The trigger already says `branches:
    # [master]`, so this is belt and braces -- but the trigger is one line
    # above the job and this is the line that decides whether the live site is
    # overwritten, and a pull request from a fork gets no token with
    # `pages: write` either way. Being explicit here means a trigger widened
    # later does not silently hand every branch a publish button.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    # The environment is what makes the deploy require the repository's Pages
    # approval rules, so a protected branch or a reviewer-gated environment
    # can still hold the live site back. Without it the job would publish
    # straight from the workflow definition.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Scoped to this job alone, not to the workflow: a build step or a
    # third-party action added to `build` later cannot spend them.
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # By *name*, not by id. `deploy-pages` v5 has no `artifact_id` input
          # -- it warns `Unexpected input(s) 'artifact_id'` and falls back to
          # this same default -- so passing one is at best ignored and at
          # worst names an artifact that does not exist.
          #
          # The name is stated rather than left to the default so the two sides
          # are visibly the same string. `upload-pages-artifact` defaults to
          # `github-pages` and so does this input; a mismatch between them
          # produces a deploy that finds no artifact, and naming it on both
          # sides makes that mismatch a diff rather than a 404 at run time.
          artifact_name: github-pages
